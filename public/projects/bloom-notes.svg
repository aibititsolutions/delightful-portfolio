<text x="200" y="44" font-size="11" fill="#6b5e7b">Data Structures  /  Trees</text>
<text x="200" y="82" font-size="24" font-weight="700" fill="#342746">Binary Search Trees</text>
<rect x="200" y="98" width="62" height="20" rx="10" fill="#ffeaf2"/><text x="212" y="112" font-size="10" fill="#342746">lecture 7</text>
<rect x="268" y="98" width="52" height="20" rx="10" fill="#eaeeff"/><text x="280" y="112" font-size="10" fill="#342746">exam</text>
<text x="200" y="150" font-size="13" fill="#342746">A BST keeps every left child smaller and every right child</text>
<text x="200" y="170" font-size="13" fill="#342746">larger than its parent, so lookups can skip half the tree.</text>
<text x="200" y="206" font-size="15" font-weight="700" fill="#342746">Complexity</text>
<circle cx="206" cy="226" r="3" fill="#f4a8cc"/><text x="218" y="230" font-size="13" fill="#342746">Search, insert, delete: O(log n) when balanced</text>
<circle cx="206" cy="248" r="3" fill="#f4a8cc"/><text x="218" y="252" font-size="13" fill="#342746">Worst case O(n) when the tree degrades to a list</text>
<rect x="200" y="274" width="330" height="112" rx="10" fill="#2e2240"/>
<text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11"><tspan x="216" y="298" fill="#c9b4ff">function</tspan><tspan fill="#ffd9e8"> search</tspan><tspan fill="#f4ecff">(node, key) {</tspan><tspan x="230" y="316" fill="#c9b4ff">if</tspan><tspan fill="#f4ecff"> (!node || node.key === key) </tspan><tspan fill="#c9b4ff">return</tspan><tspan fill="#f4ecff"> node</tspan><tspan x="230" y="334" fill="#c9b4ff">return</tspan><tspan fill="#f4ecff"> key &lt; node.key</tspan><tspan x="244" y="352" fill="#f4ecff">? search(node.left, key)</tspan><tspan x="244" y="370" fill="#f4ecff">: search(node.right, key)</tspan></text>
<text x="200" y="416" font-size="13" fill="#6b5e7b">Next: self-balancing trees (AVL, red-black)</text>
